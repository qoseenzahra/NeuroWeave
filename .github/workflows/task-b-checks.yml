name: Task B Checks

on:
  push:
    branches: [task-b-resource-authorization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps -r bakend/requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest bakend/tests -q --tb=short
        env:
          PYTHONPATH: bakend
          LOCALFLOW_SLURM_ENABLED: 'false'
      - run: python scripts/check_release.py
      - run: python scripts/build_capability_tree.py --check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
